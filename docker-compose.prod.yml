services:
  bot:
    # Pinned to the exact commit CI built, not :latest. Rolling back is then
    # editing one line in deployed-tag.env and re-running compose, instead of
    # hoping a mutable tag still points where you think it does.
    #
    # THE :latest FALLBACK IS A LAST RESORT, NOT A CONVENIENCE. CI does push that
    # tag, but the deploy script ends with `docker logout ghcr.io`, so pulling it
    # by hand on the host fails with a bare `unauthorized` against a private
    # package. Always source deployed-tag.env before a hand-run compose: the
    # pinned SHA is already in the local image cache from the last deploy, so it
    # needs no registry access at all. The fallback only helps on a host with
    # GHCR credentials and no deployed-tag.env, which in practice means a
    # developer's machine. See README's Runbook, where omitting this step broke
    # the first production deploy.
    image: ghcr.io/6586x57890143/peregrine:${PEREGRINE_IMAGE_TAG:-latest}
    read_only: true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      # The commit SHA CI built, stamped onto every tuning-export record so two
      # archives can be told apart and the report can refuse to average across a
      # change it cannot see.
      #
      # It comes from deployed-tag.env, which the deploy already writes and sources
      # before running compose, so this is the same value the image tag above uses.
      # A build stamp would be the obvious alternative and does not work:
      # .dockerignore excludes .git, so debug.ReadBuildInfo has no vcs revision
      # inside the image.
      PEREGRINE_VERSION: ${PEREGRINE_IMAGE_TAG:-dev}
    volumes:
      # The corpus. A named volume rather than a bind so its ownership matches
      # the image's nonroot uid, which is what /data was chowned to in the
      # Dockerfile. PEREGRINE_DB_PATH must point inside here: with
      # read_only: true a relative path resolves against the distroless working
      # directory and bbolt.Open fails.
      - corpus:/data
      # Backups deliberately land on a host bind, OUTSIDE the corpus volume, so
      # that losing or accidentally removing that volume does not take the
      # backups with it.
      #
      # The container WRITES here, so this needs the same uid treatment the blocklist
      # needs for reading, and for the same reason: a BIND keeps its host ownership, so
      # a directory owned by deploy is not writable by uid 65532 and every snapshot
      # fails. It fails a tick after startup rather than at startup, because the backup
      # loop is deliberately not Immediate, so nobody watching the boot logs sees it.
      #
      #   sudo chgrp 65532 backups && chmod 775 backups
      - ./backups:/backups
      # The tuning export, on a host bind for the same reason as the backups: it is
      # pulled OFF this machine, with scp, and a named volume is awkward to reach.
      #
      # SAME UID TREATMENT, same failure if it is skipped. A bind keeps its host
      # ownership, so a directory owned by deploy is not writable by uid 65532 and
      # every record is dropped. It fails a tick after startup rather than at
      # startup, so nobody watching the boot logs sees it:
      #
      #   sudo chgrp 65532 tuning && chmod 775 tuning
      #
      # Set PEREGRINE_TUNING_DIR=/tuning in .env to turn it on. Empty is the
      # default and means nothing is written.
      #
      # It holds MESSAGE TEXT: prompts people typed and replies the bot sent.
      # Treat it like the corpus, not like logs.
      - ./tuning:/tuning
      # The blocklist, read-only, as data rather than baked into the image so the
      # operator can edit it mid-incident and restart, with no rebuild and no
      # public diff. Set PEREGRINE_BLOCKLIST_PATH=/blocklist.txt in .env to use it.
      #
      # ENABLED as of the first production deploy. The operator list is where the
      # threat and illegal-content patterns live, and it is the only part of the
      # ruleset editable without a deploy.
      #
      # /home/deploy/peregrine/blocklist.txt MUST EXIST AS A FILE before this container
      # starts, and MUST BE READABLE BY UID 65532. A bind mount whose source does not
      # exist makes Docker silently create a DIRECTORY at that path, and the loader then
      # fails to read a directory as a file, which looks like a parser bug rather than a
      # missing file.
      #
      # MODE 0600 DOES NOT WORK, which is the second way this one setting failed in
      # production. The image runs USER nonroot, uid 65532, and a BIND keeps its host
      # ownership, so a file owned by deploy in 0600 is unreadable to 65532 and the bot
      # refuses to start with "permission denied" in a restart loop. The corpus volume
      # never has this problem because a NAMED volume inherits the image directory's
      # ownership when it is created empty, and the Dockerfile chowns /data to 65532.
      #
      #   sudo chgrp 65532 blocklist.txt && chmod 640 blocklist.txt
      #
      # Group-readable rather than world-readable, and still owned by deploy so it stays
      # editable mid-incident without sudo, which is the entire reason this is a bind
      # rather than baked into the image.
      #
      # It was commented out until now for that reason, and leaving it commented had
      # its own failure mode which is what actually happened: PEREGRINE_BLOCKLIST_PATH
      # was set in .env, nothing mounted anything at that path, and the bot refused to
      # start with "no such file or directory" in a restart loop. Failing closed is
      # correct, but the two halves of this setting live in two files and only one of
      # them is version controlled.
      - ./blocklist.txt:/blocklist.txt:ro
    restart: unless-stopped
    # bbolt mmaps the whole corpus. Mapped clean pages are reclaimable, so a
    # 1 GB corpus does not need 1 GB of resident memory, but a write
    # transaction dirties pages that do count against this limit. Raise it if
    # the corpus grows past a few hundred MB, and watch for the OOM killer
    # rather than guessing.
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# No pgbackup sidecar, and the omission is deliberate rather than an oversight.
# Merlin's works because pg_dump is a client asking the server for a consistent
# snapshot. There is no equivalent for bbolt, and the naive translation is
# actively dangerous: bbolt is a single mmap'd file updated by copy-on-write
# page writes plus a meta-page flip at commit, so a byte-level `cp` taken from
# outside the process can capture a state between the page write and the flip,
# or mid-remap while the file is being grown. The result either fails to open
# or opens and silently presents a torn state, and it will usually appear to
# work, which is the worst property a backup can have. A sidecar cannot take a
# proper snapshot either, because bbolt holds an exclusive flock on the file.
#
# The correct mechanism is in-process and lives in the bot: a read transaction
# calling tx.WriteTo, which is consistent by construction and does not block
# writers. internal/plugins/backup puts that on a ticker as of M13, so set
# PEREGRINE_BACKUP_DIR=/backups in .env to turn it on. Empty is the default and
# means no snapshots at all.
volumes:
  corpus:
