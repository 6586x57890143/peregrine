# Local development. Builds from the working tree instead of pulling a
# published image; see docker-compose.prod.yml for what runs on the VPS.
#
# Unlike merlin there is no database service to depend on: bbolt is an embedded
# pure-Go library, so the corpus is a file inside this container's volume and
# there is nothing to wait for at startup and no connect-retry loop.
services:
  bot:
    build: .
    read_only: true
    cap_drop:
      - ALL
    env_file:
      - .env
    volumes:
      - corpus:/data
      # The blocklist, read-only, as data rather than baked into the image so the
      # operator can edit it mid-incident without a rebuild. Uncomment once
      # ./blocklist.txt exists, and set PEREGRINE_BLOCKLIST_PATH=/blocklist.txt.
      #
      # Still commented out rather than enabled by default, and the reason is a
      # Docker behaviour worth knowing: a bind mount whose SOURCE does not exist
      # makes Docker silently create a DIRECTORY at that path. The bot would then
      # fail to open a directory as a file, which reads as a bug in the loader
      # rather than as a missing file. Copy blocklist.example.txt first.
      #
      # - ./blocklist.txt:/blocklist.txt:ro
    restart: unless-stopped

volumes:
  corpus:
